name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres for the NOTIFY and SQL probe tests (notify_test.go, probe_test.go).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: woc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      WOC_TEST_PG_URL: postgres://postgres:woc@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Visible proof that NOTIFY was tested against the Postgres service, not skipped.
      - run: go test -count=1 -v -run TestNotifyWakesGroup ./... | tee /dev/stderr | grep -q -- '--- PASS'
      # Same for the sql: work probe (and its read-only transaction).
      - run: go test -count=1 -v -run TestSQLProbe ./... | tee /dev/stderr | grep -q -- '--- PASS'
      # Docker Hub's token endpoint sometimes answers 504; retry instead of failing the run.
      - name: docker build
        run: |
          for i in 1 2 3; do
            docker build -t woc . && exit 0
            echo "build failed (attempt $i), retrying in 20 s"; sleep 20
          done
          exit 1
